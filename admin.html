<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2F4F86">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="氣墊樂園">
<title>氣墊樂園｜後台</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=7"></script>
<style>
:root{--ink:#221F4B;--ink-2:#5B5880;--line:#DCDAEA;--paper:#F3F2FA;--card:#fff;--sun:#FFD447;--sun-deep:#E8B400;--go:#2F9E6E;--go-bg:#E3F5EC;--late:#D97A00;--late-bg:#FFF0D6;--stop:#F0583C;--stop-bg:#FFECE7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
/* login */
#login{max-width:380px;margin:80px auto;background:#fff;padding:28px;border-radius:14px;border:1px solid var(--line)}
#login h1{margin:0 0 16px;font-size:24px;font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:700}
.f{margin-top:12px}.f label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:9px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--ink)}
.btn{padding:9px 14px;border:2px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-weight:700;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--stop);border-color:var(--stop)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* topbar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:24px;font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:700;margin-right:auto}
.top h1 small{font-weight:500;color:var(--ink-2);font-size:14px;margin-left:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink-2)}
.stat b{display:block;font-size:22px;color:var(--ink);line-height:1.2}
/* check-in bar */
.checkin{background:var(--sun);border-radius:14px;padding:14px;margin-bottom:14px}
.checkin label{display:block;font-weight:900;font-size:15px;margin-bottom:6px}
.checkin input{width:100%;font-size:20px;padding:12px 14px;border:2px solid var(--sun-deep);border-radius:10px}
.hits{margin-top:8px;display:grid;gap:6px}
.hit{background:#fff;border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hit .n{font-weight:900;font-size:17px}
.hit .m{color:var(--ink-2);font-size:13px;flex:1;min-width:160px}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.tab{flex:0 0 auto;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;line-height:1.2;text-align:left}
.tab b{display:block;font-size:15px}.tab small{font-size:12px;color:var(--ink-2)}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}.tab.on small{color:#CFCDE6}
.tab.fullslot b::after{content:" ●";color:var(--stop)}
.tab.on.fullslot b::after{color:var(--sun)}
/* table */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.toolbar input{padding:8px 12px;border:2px solid var(--line);border-radius:9px;min-width:220px;flex:1}
.count{color:var(--ink-2);font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--ink-2);font-weight:700;background:#FAFAFE}
tr:last-child td{border-bottom:0}
tr.arrived td{background:var(--go-bg)} tr.late td{background:var(--late-bg)} tr.absent td{background:var(--stop-bg);color:#8A4A3D}
.idn{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.who{font-weight:700}
.tag{font-size:12px;color:var(--ink-2)}
.st{display:inline-flex;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.st button{border:0;background:#fff;padding:5px 9px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.st button+button{border-left:1px solid var(--line)}
.st button.on{font-weight:900;color:#fff}
.st button.on[data-s=booked]{background:var(--ink-2)}
.st button.on[data-s=arrived]{background:var(--go)}
.st button.on[data-s=late]{background:var(--late)}
.st button.on[data-s=absent]{background:var(--stop)}
.empty{padding:30px;text-align:center;color:var(--ink-2)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(34,31,75,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.open{display:flex}
.box{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.box h2{margin:0 0 6px;font-size:18px;font-weight:900}
.actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;display:none;z-index:10}
.err{color:var(--stop);font-size:13px;margin-top:8px;min-height:1em}
@media (max-width:640px){th.hide,td.hide{display:none} .wrap{padding:10px}}
</style>
</head>
<body>

<section id="login" style="display:none">
  <h1>氣墊樂園 後台</h1>
  <div class="f"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
  <div class="f"><label>密碼</label><input id="pw" type="password" autocomplete="current-password"></div>
  <div class="err" id="loginErr"></div>
  <button class="btn primary" id="loginBtn" style="width:100%;margin-top:10px">登入</button>
</section>

<div class="wrap" id="app" style="display:none">
  <div class="top">
    <h1 id="title">氣墊樂園<small id="subtitle"></small></h1>
    <button class="btn" id="addBtn">＋ 手動新增</button>
    <button class="btn" id="csvBtn">匯出 CSV</button>
    <button class="btn" id="setBtn">活動設定</button>
    <button class="btn" id="refreshBtn">重新整理</button>
    <button class="btn" id="logoutBtn">登出</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="checkin">
    <label for="ci">現場報到：輸入手機號碼、學號／教職員編號或姓名</label>
    <input id="ci" placeholder="掃描或輸入後，直接按「到場」" autocomplete="off">
    <div class="hits" id="hits"></div>
  </div>

  <div class="tabs" id="dayTabs"></div>
  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <input id="filter" placeholder="篩選此時段：姓名或號碼">
    <span class="count" id="count"></span>
  </div>
  <div id="tableWrap"></div>
</div>

<!-- 編輯 / 新增 -->
<div class="modal" id="editModal"><div class="box">
  <h2 id="editTitle">編輯</h2>
  <div class="f"><label>姓名</label><input id="eName"></div>
  <div class="f"><label>身分</label><select id="eIdentity"><option value="student">校內學生</option><option value="staff">教職員</option><option value="external">校外人士</option></select></div>
  <div class="f"><label>手機號碼</label><input id="ePhone" inputmode="numeric"></div>
  <div class="f"><label>Email</label><input id="eEmail" type="email"></div>
  <div class="f" id="eStudentF"><label>學號</label><input id="eStudentId"></div>
  <div class="f" id="eStaffF"><label>教職員編號</label><input id="eStaffId"></div>
  <div class="f"><label>日期</label><select id="eDay"></select></div>
  <div class="f"><label>時段</label><select id="eSlot"></select></div>
  <div class="f"><label>狀態</label><select id="eStatus"><option value="booked">未到</option><option value="arrived">到場</option><option value="late">遲到</option><option value="absent">缺席</option></select></div>
  <div class="f"><label>備註</label><input id="eNote" placeholder="例：改由 XXX 代替"></div>
  <div class="err" id="editErr"></div>
  <div class="actions">
    <button class="btn danger" id="delBtn">刪除</button>
    <span style="flex:1"></span>
    <button class="btn" onclick="closeModal('editModal')">取消</button>
    <button class="btn primary" id="saveBtn">儲存</button>
  </div>
</div></div>

<!-- 活動設定 -->
<div class="modal" id="setModal"><div class="box">
  <h2>活動設定</h2>
  <div class="f"><label>活動名稱</label><input id="sName"></div>
  <div class="f"><label>活動日期（一行一個，例 9/21；已有人預約的日期請勿改名）</label><textarea id="sDays" rows="3"></textarea></div>
  <div class="f"><label>每時段名額上限</label><input id="sCap" type="number" min="1"></div>
  <div class="f"><label>開放報名</label><select id="sOpen"><option value="true">開放</option><option value="false">關閉</option></select></div>
  <div class="f"><label>前台公告（可留空）</label><input id="sNotice"></div>
  <div class="f"><label>時段（一行一個；已有人預約的時段請勿改名）</label><textarea id="sSlots" rows="8"></textarea></div>
  <div class="f"><label>活動須知與免責聲明（一行一條，前台會自動編號）</label><textarea id="sTerms" rows="10" style="font-size:13px"></textarea></div>
  <div class="err" id="setErr"></div>
  <div class="actions">
    <button class="btn" onclick="closeModal('setModal')">取消</button>
    <button class="btn primary" id="saveSetBtn">儲存設定</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const IDENTITY = { student:'學生', staff:'教職員', external:'校外' };
const STATUS   = { booked:'未到', arrived:'到場', late:'遲到', absent:'缺席' };
let settings = null, rows = [], dayTab = null, tab = 'ALL', editing = null, channel = null;
const idOf = r => r.identity==='student' ? r.student_id : r.identity==='staff' ? r.staff_id : '';

/* ---------- 登入 ---------- */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session) start(); else $('#login').style.display='block';
}
$('#loginBtn').addEventListener('click', login);
$('#pw').addEventListener('keydown', e => { if (e.key==='Enter') login(); });
async function login(){
  $('#loginErr').textContent='';
  const { error } = await sb.auth.signInWithPassword({ email:$('#email').value.trim(), password:$('#pw').value });
  if (error) { $('#loginErr').textContent='登入失敗：帳號或密碼不正確。'; return; }
  $('#login').style.display='none'; start();
}
$('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function start(){
  $('#app').style.display='block';
  await loadAll();
  channel = sb.channel('bookings').on('postgres_changes', { event:'*', schema:'public', table:'bookings' }, () => loadRows()).subscribe();
  setInterval(loadRows, 30000);
  $('#ci').focus();
}

/* ---------- 讀取 ---------- */
async function loadAll(){
  const { data, error } = await sb.from('event_settings').select('*').eq('id',1).single();
  if (error) return toast('讀取設定失敗');
  settings = data;
  $('#title').firstChild.textContent = settings.event_name;
  $('#subtitle').textContent = settings.days.join('、') + '　每場上限 ' + settings.capacity + ' 人' + (settings.is_open ? '' : '　（報名已關閉）');
  document.title = settings.event_name + '｜後台';
  $('#eSlot').innerHTML = settings.slots.map(s => `<option>${s}</option>`).join('');
  $('#eDay').innerHTML = settings.days.map(d => `<option>${d}</option>`).join('');
  if (!dayTab || !settings.days.includes(dayTab)) dayTab = todayLabel() || settings.days[0];
  await loadRows();
}
async function loadRows(){
  const { data, error } = await sb.from('bookings').select('*').order('created_at');
  if (error) return toast('讀取資料失敗');
  rows = data; render();
}

/* ---------- 畫面 ---------- */
function render(){
  const total = rows.length, arrived = rows.filter(r=>r.status==='arrived'||r.status==='late').length;
  const absent = rows.filter(r=>r.status==='absent').length;
  $('#stats').innerHTML = `
    <div class="stat">總預約<b>${total}</b></div>
    <div class="stat">已報到<b>${arrived}</b></div>
    <div class="stat">未到<b>${total-arrived-absent}</b></div>
    <div class="stat">缺席<b>${absent}</b></div>
    <div class="stat">目前時段<b>${currentSlot() || '—'}</b></div>`;

  const byDay = {}; rows.forEach(r => (byDay[r.day] = byDay[r.day] || []).push(r));
  $('#dayTabs').innerHTML = settings.days.map(d => {
    const rs = byDay[d]||[], a = rs.filter(r=>r.status==='arrived'||r.status==='late').length;
    return `<button class="tab ${dayTab===d?'on':''}" data-d="${d}"><b>${d}${d===todayLabel()?' 今天':''}</b><small>${rs.length} 人　到 ${a}</small></button>`;
  }).join('');
  document.querySelectorAll('#dayTabs .tab').forEach(b => b.onclick = () => { dayTab = b.dataset.d; render(); });

  const dayRows = byDay[dayTab] || [];
  const bySlot = {}; dayRows.forEach(r => (bySlot[r.slot] = bySlot[r.slot] || []).push(r));
  const cur = dayTab===todayLabel() ? currentSlot() : null;
  $('#tabs').innerHTML = `<button class="tab ${tab==='ALL'?'on':''}" data-t="ALL"><b>${dayTab} 全部</b><small>${dayRows.length} 人</small></button>` +
    settings.slots.map(s => {
      const n = (bySlot[s]||[]).length, a = (bySlot[s]||[]).filter(r=>r.status==='arrived'||r.status==='late').length;
      return `<button class="tab ${tab===s?'on':''} ${n>=settings.capacity?'fullslot':''}" data-t="${s}"><b>${s}${s===cur?' ◀':''}</b><small>${n}/${settings.capacity}　到 ${a}</small></button>`;
    }).join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });

  const q = $('#filter').value.trim().toLowerCase();
  let list = tab==='ALL' ? dayRows : dayRows.filter(r => r.slot===tab);
  if (q) list = list.filter(r => r.name.toLowerCase().includes(q) || r.phone.includes(q) || idOf(r).toLowerCase().includes(q));
  $('#count').textContent = `${list.length} 人`;
  if (!list.length) { $('#tableWrap').innerHTML = `<div class="empty">這個時段還沒有人預約</div>`; return; }
  $('#tableWrap').innerHTML = `<table><thead><tr>
    <th>姓名</th><th>手機</th><th class="hide">學號／編號</th><th class="hide">Email</th>${tab==='ALL'?'<th>時段</th>':''}<th>狀態</th><th class="hide">備註</th><th></th>
  </tr></thead><tbody>${list.map(r => `<tr class="${r.status}">
    <td><span class="who">${esc(r.name)}</span> <span class="tag">${IDENTITY[r.identity]}</span></td>
    <td class="idn">${esc(r.phone)}</td>
    <td class="idn hide">${esc(idOf(r))}</td>
    <td class="hide tag">${esc(r.email||'')}${r.confirm_sent_at?' ✓':''}</td>
    ${tab==='ALL'?`<td>${r.slot}</td>`:''}
    <td>${statusSeg(r)}</td>
    <td class="hide tag">${esc(r.note||'')}</td>
    <td><button class="btn sm" onclick="openEdit('${r.id}')">編輯</button></td>
  </tr>`).join('')}</tbody></table>`;
}
function statusSeg(r){
  return `<span class="st">${Object.keys(STATUS).map(s =>
    `<button data-s="${s}" class="${r.status===s?'on':''}" onclick="setStatus('${r.id}','${s}')">${STATUS[s]}</button>`).join('')}</span>`;
}
function todayLabel(){ const d=new Date(); return settings.days.find(x => x === (d.getMonth()+1)+'/'+d.getDate()); }
function currentSlot(){
  const now = new Date(), m = now.getHours()*60 + now.getMinutes();
  return settings.slots.find(s => { const [a,b]=s.split('-').map(t=>{const [h,mm]=t.split(':').map(Number);return h*60+mm;}); return m>=a-5 && m<=b; });
}
$('#filter').addEventListener('input', render);
$('#refreshBtn').addEventListener('click', () => { loadAll(); toast('已更新'); });

/* ---------- 報到搜尋 ---------- */
$('#ci').addEventListener('input', () => {
  const q = $('#ci').value.trim().toLowerCase(), box = $('#hits');
  if (q.length < 2) { box.innerHTML=''; return; }
  const hits = rows.filter(r => r.phone.includes(q) || idOf(r).toLowerCase().includes(q) || r.name.toLowerCase().includes(q))
    .sort((a,b) => (a.day===dayTab?0:1) - (b.day===dayTab?0:1)).slice(0,6);
  box.innerHTML = hits.length ? hits.map(r => `<div class="hit">
    <span class="n">${esc(r.name)}</span>
    <span class="m">${IDENTITY[r.identity]}｜${esc(r.phone)}${idOf(r)?'｜'+esc(idOf(r)):''}｜<b>${r.day} ${r.slot}</b>｜${STATUS[r.status]}</span>
    <button class="btn sm primary" onclick="setStatus('${r.id}','arrived',true)">到場</button>
    <button class="btn sm" onclick="setStatus('${r.id}','late',true)">遲到</button>
    <button class="btn sm" onclick="openEdit('${r.id}')">編輯</button>
  </div>`).join('') : `<div class="hit"><span class="m">查無此人 — 可用右上「手動新增」補登</span></div>`;
});
$('#ci').addEventListener('keydown', e => {
  if (e.key==='Enter') { const b = $('#hits .btn.primary'); if (b) b.click(); }
});

/* ---------- 狀態更新 ---------- */
async function setStatus(id, status, fromCheckin){
  const r = rows.find(x => x.id===id); if (!r) return;
  const patch = { status, updated_at:new Date().toISOString(),
    checked_in_at: (status==='arrived'||status==='late') ? new Date().toISOString() : null };
  const { error } = await sb.from('bookings').update(patch).eq('id', id);
  if (error) return toast('更新失敗');
  r.status = status; render();
  toast(`${r.name}：${STATUS[status]}`);
  if (fromCheckin) { $('#ci').value=''; $('#hits').innerHTML=''; $('#ci').focus(); }
}

/* ---------- 編輯 / 新增 / 刪除 ---------- */
function openEdit(id){
  editing = id ? rows.find(r=>r.id===id) : null;
  $('#editTitle').textContent = editing ? '編輯預約' : '手動新增';
  $('#eName').value = editing?.name || '';
  $('#eIdentity').value = editing?.identity || 'student';
  $('#ePhone').value = editing?.phone || '';
  $('#eEmail').value = editing?.email || '';
  $('#eStudentId').value = editing?.student_id || '';
  $('#eStaffId').value = editing?.staff_id || '';
  $('#eDay').value = editing?.day || dayTab;
  $('#eSlot').value = editing?.slot || tab!=='ALL' && tab || settings.slots[0];
  syncIdFields();
  $('#eStatus').value = editing?.status || 'booked';
  $('#eNote').value = editing?.note || '';
  $('#delBtn').style.display = editing ? '' : 'none';
  $('#editErr').textContent='';
  $('#editModal').classList.add('open'); $('#eName').focus();
}
function syncIdFields(){ const v=$('#eIdentity').value; $('#eStudentF').style.display = v==='student'?'':'none'; $('#eStaffF').style.display = v==='staff'?'':'none'; }
$('#eIdentity').addEventListener('change', syncIdFields);
$('#addBtn').addEventListener('click', () => openEdit(null));
$('#saveBtn').addEventListener('click', async () => {
  const identity = $('#eIdentity').value;
  const rec = { name:$('#eName').value.trim(), identity, phone:$('#ePhone').value.replace(/\D/g,''), email:$('#eEmail').value.trim().toLowerCase(),
    student_id: identity==='student' ? $('#eStudentId').value.trim() : '',
    staff_id:   identity==='staff'   ? $('#eStaffId').value.trim()   : '',
    day:$('#eDay').value, slot:$('#eSlot').value, status:$('#eStatus').value, note:$('#eNote').value.trim(), updated_at:new Date().toISOString() };
  if (!rec.name || !rec.phone) { $('#editErr').textContent='姓名與手機號碼必填'; return; }
  const n = rows.filter(r => r.day===rec.day && r.slot===rec.slot && r.id!==editing?.id).length;
  if (n >= settings.capacity && !confirm(`${rec.day} ${rec.slot} 已達上限 ${settings.capacity} 人，仍要加入？`)) return;
  const res = editing ? await sb.from('bookings').update(rec).eq('id', editing.id) : await sb.from('bookings').insert(rec);
  if (res.error) { $('#editErr').textContent = res.error.code==='23505' ? '這支手機當天已經有另一筆預約（每天最多一場）' : '儲存失敗：'+res.error.message; return; }
  closeModal('editModal'); toast('已儲存'); loadRows();
});
$('#delBtn').addEventListener('click', async () => {
  if (!editing || !confirm(`確定刪除 ${editing.name} 的預約？名額會釋出。`)) return;
  const { error } = await sb.from('bookings').delete().eq('id', editing.id);
  if (error) return toast('刪除失敗');
  closeModal('editModal'); toast('已刪除'); loadRows();
});

/* ---------- 活動設定 ---------- */
$('#setBtn').addEventListener('click', () => {
  $('#sName').value=settings.event_name; $('#sDays').value=settings.days.join('\n'); $('#sCap').value=settings.capacity;
  $('#sOpen').value=String(settings.is_open); $('#sNotice').value=settings.notice||''; $('#sSlots').value=settings.slots.join('\n'); $('#sTerms').value=settings.terms||'';
  $('#setErr').textContent=''; $('#setModal').classList.add('open');
});
$('#saveSetBtn').addEventListener('click', async () => {
  const slots = $('#sSlots').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const days = $('#sDays').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const cap = parseInt($('#sCap').value,10);
  if (!days.length || !slots.length || !(cap>0)) { $('#setErr').textContent='日期、時段與名額不能為空'; return; }
  const { error } = await sb.from('event_settings').update({ event_name:$('#sName').value.trim(), days,
    capacity:cap, is_open:$('#sOpen').value==='true', notice:$('#sNotice').value.trim(), slots, terms:$('#sTerms').value.trim() }).eq('id',1);
  if (error) { $('#setErr').textContent='儲存失敗：'+error.message; return; }
  closeModal('setModal'); toast('設定已更新'); loadAll();
});

/* ---------- 匯出 ---------- */
$('#csvBtn').addEventListener('click', () => {
  const head = ['日期','時段','姓名','身分','手機','Email','學號','教職員編號','狀態','報到時間','備註','預約時間'];
  const body = [...rows].sort((a,b)=>(a.day+a.slot).localeCompare(b.day+b.slot)).map(r => [r.day, r.slot, r.name, IDENTITY[r.identity], r.phone, r.email||'', r.student_id, r.staff_id, STATUS[r.status],
    r.checked_in_at ? new Date(r.checked_in_at).toLocaleString('zh-TW') : '', r.note, new Date(r.created_at).toLocaleString('zh-TW')]);
  const csv = '\uFEFF' + [head, ...body].map(l => l.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = `${settings.event_name}_預約名單_${new Date().toISOString().slice(0,10)}.csv`; a.click();
});

/* ---------- 工具 ---------- */
function closeModal(id){ $('#'+id).classList.remove('open'); }
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target===m) m.classList.remove('open'); }));
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(tt); tt=setTimeout(()=>t.style.display='none',1800); }
init();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
